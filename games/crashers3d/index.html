<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14161c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%23ffb3c1' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='11.5' cy='14' r='2' fill='%232b2b3a'/%3E%3Ccircle cx='20.5' cy='14' r='2' fill='%232b2b3a'/%3E%3C/svg%3E"
    />
    <title>Blob Crashers 3D — Interverse</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #14161c;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #f2eff8;
        z-index: 5;
      }
      #hearts {
        position: absolute;
        top: 12px;
        left: 16px;
        font-size: 26px;
        letter-spacing: 3px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #wave {
        position: absolute;
        top: 14px;
        right: 16px;
        font-size: 18px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #banner {
        position: absolute;
        top: 30%;
        width: 100%;
        text-align: center;
        font-size: 40px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        opacity: 0;
        transition: opacity 0.2s;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(10, 12, 16, 0.84);
        color: #f2eff8;
        z-index: 10;
      }
      #overlay h1 {
        margin: 0;
        font-size: 40px;
      }
      #overlay p {
        margin: 0;
        color: #9aa4b0;
        font-size: 17px;
        max-width: 32em;
        text-align: center;
      }
      #overlay button {
        pointer-events: auto;
        padding: 14px 44px;
        font: 800 22px system-ui, sans-serif;
        color: #1c1c28;
        background: #ffb3c1;
        border: 0;
        border-radius: 999px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      }
      .hidden {
        display: none !important;
      }
      /* ⚔ On-screen combat buttons — UI in 3D is DOM: crisp at any DPR,
         zero draw calls, and a thumb-sized target on a phone. */
      #btns {
        position: fixed;
        right: 18px;
        bottom: 20px;
        display: flex;
        gap: 12px;
        z-index: 6;
      }
      #btns button {
        pointer-events: auto;
        width: 74px;
        height: 74px;
        border-radius: 999px;
        border: 0;
        font-size: 30px;
        color: #1c1c28;
        background: #ffd166;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
        position: relative;
      }
      #btns button.cool {
        filter: grayscale(0.8);
        opacity: 0.55;
      }
      #btns button small {
        position: absolute;
        bottom: 4px;
        left: 0;
        right: 0;
        font-size: 12px;
        font-weight: 800;
        color: #1c1c28;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="hearts"></div>
      <div id="wave"></div>
      <div id="banner"></div>
    </div>
    <div id="btns">
      <button id="btn-spin" title="Spin sweep (K)">🌀<small id="cd-spin"></small></button>
      <button id="btn-slam" title="Slam (L)">💥<small id="cd-slam"></small></button>
      <button id="btn-attack" title="Attack (Space/J)">⚔</button>
    </div>
    <div id="overlay">
      <h1>Blob Crashers <span style="color: #ffb3c1">3D</span></h1>
      <p id="stats-line">
        Golems guard the canyon. Walk in, break their waves, reach the far gate.
      </p>
      <p>WASD / drag to move · space or tap to attack — chain three for the launcher</p>
      <button id="play">▶ Brawl</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
