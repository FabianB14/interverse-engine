<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121a17" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%236ec5ff' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='11.5' cy='14' r='2' fill='%232b2b3a'/%3E%3Ccircle cx='20.5' cy='14' r='2' fill='%232b2b3a'/%3E%3C/svg%3E"
    />
    <title>Blob Rush 3D — Interverse</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #121a17;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      /* The HUD is DOM, not draw calls: a 3D game's text is the one place
         the browser already beats a canvas — free layout, free crispness at
         any DPR, and zero cost to the frame budget. */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #f2eff8;
        z-index: 5;
      }
      #metres {
        position: absolute;
        top: 12px;
        left: 16px;
        font-size: 30px;
        font-weight: 800;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #coins {
        position: absolute;
        top: 50px;
        left: 16px;
        font-size: 20px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #zone {
        position: absolute;
        top: 14px;
        right: 16px;
        font-size: 17px;
        text-align: right;
        color: #9ab0a4;
      }
      #chase {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: min(320px, 32vw);
        height: 13px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      #chasefill {
        height: 100%;
        width: 0%;
        border-radius: 7px;
        background: #8affc1;
        transition: width 0.15s linear;
      }
      #banner {
        /* High and small: the middle of the screen is where obstacles are
           read, and a zone name is never worth an unread log. */
        position: absolute;
        top: 9%;
        width: 100%;
        text-align: center;
        font-size: 26px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        opacity: 0;
        transition: opacity 0.2s;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(10, 14, 12, 0.82);
        color: #f2eff8;
        z-index: 10;
      }
      #overlay h1 {
        margin: 0;
        font-size: 42px;
      }
      #overlay p {
        margin: 0;
        color: #9ab0a4;
        font-size: 17px;
      }
      #overlay button {
        pointer-events: auto;
        padding: 14px 44px;
        font: 800 22px system-ui, sans-serif;
        color: #1c1c28;
        background: #8affc1;
        border: 0;
        border-radius: 999px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="metres">0 m</div>
      <div id="coins">🪙 0</div>
      <div id="zone"></div>
      <div id="chase"><div id="chasefill"></div></div>
      <div id="banner"></div>
    </div>
    <div id="overlay">
      <h1>Blob Rush <span style="color: #8affc1">3D</span></h1>
      <p id="stats-line"></p>
      <p>swipe to dodge · up to jump · down to slide · swipe into corners</p>
      <button id="play">▶ Run</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
